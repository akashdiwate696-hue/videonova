<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>VideoNova AI — Story Studio</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1a2638;--line:#34445c;--text:#f5f7fb;--muted:#aab7c9;--accent:#7c6cf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif}
header{padding:18px 16px;border-bottom:1px solid var(--line);font-size:22px;font-weight:800}header span{color:#a99cff}
main{max-width:850px;margin:28px auto;padding:0 15px 50px}.intro h1{font-size:clamp(26px,6vw,38px);margin:0 0 6px}.muted{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
label{display:block;margin:12px 0 6px;font-size:14px}textarea,input[type=file]{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#111c2c;color:var(--text);font:inherit}textarea{min-height:180px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:white;font-weight:700;font-size:15px;cursor:pointer}button.alt{background:#2b3b53;border:1px solid #455872}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.scene{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px;background:#111c2c}.scene strong{color:#b9afff}.scene p{margin:6px 0}.prompt{font-size:13px;color:var(--muted);white-space:pre-wrap}
#result{display:none}.notice{padding:11px;border-radius:10px;background:#111c2c;color:var(--muted);font-size:13px;margin-top:12px}
@media(max-width:600px){main{margin-top:18px}.card{padding:14px}}
</style>
</head>
<body>
<header>VideoNova <span>AI</span></header>
<main>
<section class="intro">
<h1>अपनी कहानी को Scene में बदलें</h1>
<div class="muted">कहानी डालें, अपने आप scenes और image prompts तैयार करें।</div>
</section>
<section class="card">
<h2>1. अपनी कहानी डालें</h2>
<label for="file">कहानी की फ़ाइल चुनें (.txt)</label>
<input id="file" type="file" accept=".txt,.md,text/plain">
<label for="story">या यहाँ कहानी paste करें</label>
<textarea id="story" placeholder="अपनी पूरी कहानी यहाँ लिखें या paste करें..."></textarea>
<div class="buttons">
<button id="create">Scenes बनाएं</button>
<button class="alt" id="clear">Clear</button>
</div>
<label for="backend">Render Backend URL</label><input id="backend" type="url" placeholder="https://your-service.onrender.com" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#111c2c;color:var(--text)"><div class="notice">अपनी API Key यहाँ न डालें। Gemini Key Render Backend में सुरक्षित रहेगी।</div>
</section>
<section class="card" id="result">
<h2>2. आपकी Scene List</h2>
<div id="scenes"></div><div class="buttons"><button id="images">सभी Scene Images Generate करें</button></div>
<div class="buttons">
<button id="download">Scene Plan डाउनलोड करें</button>
<button class="alt" id="copy">सभी Prompts Copy करें</button>
<button class="alt" id="speak">कहानी सुनें</button>
<button class="alt" id="stop">Stop</button>
</div>
<div id="status" class="notice" aria-live="polite"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let plan=[]; $('backend').value=localStorage.getItem('vn_backend_url')||''; $('backend').addEventListener('change',()=>localStorage.setItem('vn_backend_url',$('backend').value.trim().replace(/\\/$/,'')));
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)$('story').value=await f.text();});
function splitStory(text){
 const parts=text.replace(/\r/g,' ').split(/(?<=[.!?।])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
 const scenes=[];let group='';
 for(const sentence of parts){if(group&&(group.length+sentence.length+1>220)){scenes.push(group);group='';}group+=(group?' ':'')+sentence;}
 if(group)scenes.push(group);return scenes;
}
function makePrompt(text,i){return 'Create a cinematic 16:9 story illustration for scene '+(i+1)+'. Show this exact moment: '+text+'. Keep the same character appearance and clothing consistent across all scenes. Rich detailed background, expressive characters, cinematic lighting, no text, no collage.';}
$('create').onclick=()=>{
 const story=$('story').value.trim();if(!story){$('status').textContent='पहले अपनी कहानी लिखें या फ़ाइल चुनें।';$('result').style.display='block';return;}
 plan=splitStory(story).map((text,i)=>({text,prompt:makePrompt(text,i)}));
 $('scenes').innerHTML='';plan.forEach((s,i)=>{const card=document.createElement('div');card.className='scene';const title=document.createElement('strong');title.textContent='Scene '+(i+1);const p=document.createElement('p');p.textContent=s.text;const prompt=document.createElement('div');prompt.className='prompt';prompt.textContent='Image Prompt: '+s.prompt;card.append(title,p,prompt);$('scenes').append(card);});
 $('result').style.display='block';$('status').textContent=plan.length+' scenes तैयार हैं।';$('result').scrollIntoView({behavior:'smooth'});
};
$('clear').onclick=()=>{$('story').value='';$('file').value='';$('scenes').innerHTML='';$('result').style.display='none';plan=[];if('speechSynthesis'in window)speechSynthesis.cancel();};
$('images').onclick=async()=>{if(!plan.length){$('status').textContent='पहले Scenes बनाएं।';return;}const base=$('backend').value.trim().replace(/\/$/,'');if(!base){$('status').textContent='पहले Render Backend URL डालें।';return;}const btn=$('images');btn.disabled=true;try{for(let i=0;i<plan.length;i++){const card=$('scenes').children[i];$('status').textContent='Scene '+(i+1)+' / '+plan.length+' की image बन रही है…';const r=await fetch(base+'/api/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:plan[i].prompt})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Image API error '+r.status);const img=document.createElement('img');img.src='data:'+(d.mimeType||'image/png')+';base64,'+d.image;img.alt='Scene '+(i+1);img.style.cssText='width:100%;border-radius:10px;margin-top:10px';card.append(img);plan[i].image=img.src;} $('status').textContent='सभी '+plan.length+' images तैयार हैं।';}catch(e){$('status').textContent='Image generation failed: '+e.message;}finally{btn.disabled=false;}};\n$('download').onclick=()=>{if(!plan.length)return;const text=plan.map((s,i)=>'SCENE '+(i+1)+'\n'+s.text+'\n\nIMAGE PROMPT\n'+s.prompt).join('\n\n--------------------\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='videonova-scene-plan.txt';a.click();URL.revokeObjectURL(a.href);};
$('copy').onclick=async()=>{if(!plan.length)return;const text=plan.map((s,i)=>'Scene '+(i+1)+': '+s.text+'\nImage Prompt: '+s.prompt).join('\n\n');try{await navigator.clipboard.writeText(text);$('status').textContent='सभी prompts copy हो गए।';}catch(e){$('status').textContent='Copy नहीं हुआ। Scene Plan डाउनलोड करें।';}};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){ $('status').textContent='इस browser में voice support नहीं है।';return;}const t=$('story').value.trim();if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0900-\u097F]/.test(t)?'hi-IN':'en-IN';speechSynthesis.speak(u);};
$('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();};
</script>
</body>
</html>
